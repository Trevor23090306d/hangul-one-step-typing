function render(){if(s&&route==='practice')practice();else if(route==='groups')groups();else if(route==='mixed')mixed();else if(route==='library')library();else if(route==='progress')progress();else if(route==='result')result();else home();}
const keyMode=()=>['guide','keys','mixed'].includes(s.mode),target=()=>keyMode()?C.KEYMAP[s.tokens[0]]:s.item.text;
function focus(){if(s&&input==='native'&&!s.paused){document.getElementById('answer')?.focus({preventScroll:true});window.HangulAndroid?.showKeyboard?.();}}
function practice(){shell('<section class="panel practice-card" id="practice-card"><div class="card-top"><span class="pill" id="step-name"></span><span class="timer" id="timer"></span></div><div class="target-zone"><p class="question-label" id="question-label"></p><div class="kr" lang="ko" id="target-text"></div><p class="meaning" id="meaning"></p>'+(input==='native'?'<label class="native-label" for="answer">用手機韓文鍵盤輸入</label><input id="answer" class="native-answer kr" lang="ko" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" aria-label="輸入韓文答案"><p class="composition-note">組字時字形會變動；請自行輸入，避免整詞候選、語音代答。</p>':'<div class="typing-preview kr" id="preview" aria-label="已輸入韓文"></div>')+'<div id="hint-area"></div><p id="feedback" class="feedback" role="status"></p></div><div class="practice-actions"><div class="action-left">'+btn('提示','data-action="hint"',true)+btn('暫停','data-action="pause"',true)+'</div><button class="text-btn" data-action="finish">結束並看結果</button></div><div id="pause-area"></div></section>','讓手指，記住這個位置。');const el=document.getElementById('answer');if(el){el.addEventListener('compositionstart',()=>{if(s){s.composing=true;clearTimeout(imeTimer);}});el.addEventListener('compositionend',()=>{if(s){s.composing=false;nativeInput();}});el.addEventListener('input',nativeInput);el.addEventListener('paste',e=>{e.preventDefault();toast('請自行輸入，練習鍵位記憶。');});el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();if(el.value.normalize('NFC')===target())nativeDone();}});}paint(true);focus();}
function paint(fresh=false){if(!s)return;document.getElementById('step-name').textContent=modes[s.mode];document.getElementById('question-label').textContent=s.mode==='guide'?'先看看位置，跟著輸入。':keyMode()?'這個字母，在哪個位置？':'照著目標輸入完整詞句。';const t=document.getElementById('target-text');t.textContent=target();t.className='kr '+(keyMode()?'target-glyph':'target-word');document.getElementById('meaning').textContent=s.item?.meaning||'';const k=s.tokens[Math.min(s.cursor,s.tokens.length-1)];document.getElementById('hint-area').innerHTML=s.mode==='guide'||s.hinted?'<p class="mapping"><span class="kr">'+esc(C.KEYMAP[k])+'</span> → <kbd>'+esc(C.label(k))+'</kbd></p><p class="subtitle">'+s.tokens.map(k=>esc(C.KEYMAP[k])).join(' · ')+'</p>':'';const f=document.getElementById('feedback');f.textContent=s.feedback||'';f.classList.toggle('error',!!s.errorFeedback);const p=document.getElementById('preview');if(p)p.textContent=keyMode()?'':C.compose(s.tokens.slice(0,s.cursor));const a=document.getElementById('answer');if(a){a.disabled=s.paused||s.transitioning;if(fresh){a.value='';s.composing=false;}}document.getElementById('pause-area').innerHTML=s.paused?'<div class="pause-layer"><h2>休息一下，沒關係。</h2><p>計時已暫停。</p>'+btn('繼續練習','data-action="resume"')+'<button data-action="finish" class="text-btn">結束這一回合</button></div>':'';tick();}
function next(){clearTimeout(imeTimer);Object.assign(s,{cursor:0,results:[],errors:0,hinted:false,feedback:'',errorFeedback:false,transitioning:false,stepStart:s.elapsed,composing:false});if(s.mode==='guide')s.tokens=[s.queue[s.guideIndex]];else if(['keys','mixed'].includes(s.mode)){const keys=s.mode==='mixed'?s.mixKeys:D.groups.find(g=>g.id===s.groupId).keys,min=Math.min(...keys.map(k=>s.counts[k]||0)),pool=keys.filter(k=>(s.counts[k]||0)<=min+1);const k=C.chooseKey(pool,stats().keys,s.counts,s.previous);s.tokens=[k];s.previous=k;}else{let pool=s.pool.filter(x=>x.key!==s.item?.key);if(!pool.length)pool=s.pool;const st=stats().items,w=pool.map(x=>{const a=st[x.key];return 1+(a?.attempts?4*(1-a.firstCorrect/a.attempts)+a.hinted/a.attempts:3)+(x.lessonDate===s.latest?1:0);});let n=Math.random()*w.reduce((a,b)=>a+b,0),i=0;while(i<pool.length-1&&(n-=w[i])>0)i++;s.item=pool[i];s.tokens=s.item.tokens;}}
function start(mode,gid,ik){if(s)finish(false);catalog();const g=D.groups.find(g=>g.id===gid)||suggested(),item=items.find(x=>x.key===ik);if(item)mode=item.type;const pool=item?[item]:items.filter(x=>x.type===mode&&(!chapter||x.chapters.includes(chapter))),ids=(selection||knownGroups().map(g=>g.id)).filter(x=>state.guides.includes(x));if(mode==='mixed'&&!ids.length){route='mixed';render();toast('先完成一組導學，再選已學組別。');return;}if(['words','sentences'].includes(mode)&&!pool.length)return;const queue=[];if(mode==='guide')for(let i=0;i<g.keys.length;i+=2)queue.push(...g.keys.slice(i,i+2),...g.keys.slice(i,i+2));s={id:M.id(),at:new Date().toISOString(),inputMode:input,mode,groupId:['guide','keys'].includes(mode)?g.id:null,pool,pinned:ik,queue,guideIndex:0,guidePresses:0,elapsed:0,lastTick:performance.now(),minutes:state.settings.minutes,paused:false,events:[],questions:0,counts:{},mixKeys:M.mixedKeys(D.groups,ids),previous:'',latest:pool.map(x=>x.lessonDate).sort().at(-1)||''};next();route='practice';practice();}
function persist(){if(!s||(!s.events.length&&!s.guidePresses))return;const r={id:s.id,at:s.at,inputMode:s.inputMode,mode:s.mode,groupId:s.groupId,elapsed:s.elapsed,questions:s.questions,events:s.events.slice()};state.sessions=state.sessions.filter(x=>x.id!==r.id).concat([r]);save();}
function guideDone(){s.guidePresses++;state.introduced=[...new Set([...state.introduced,s.tokens[0]])];s.guideIndex++;save();if(s.guideIndex===s.queue.length){state.guides=[...new Set([...state.guides,s.groupId])];selection=null;persist();const g=s.groupId;s=null;start('keys',g);toast('導學完成，這組已加入混練。');return;}next();paint(true);focus();}
function record(e){s.events.push(e);if(e.key){s.counts[e.key]=(s.counts[e.key]||0)+1;state.introduced=[...new Set([...state.introduced,e.key])];}}
function done(){s.questions++;persist();if(s.expired){finish();return;}s.transitioning=true;s.feedback='答對了！';paint();const active=s,go=()=>{if(s!==active)return;if(s.paused){setTimeout(go,200);return;}next();paint(true);focus();};setTimeout(go,keyMode()?350:1000);}
function nativeInput(){if(!s||s.paused||s.transitioning)return;tick();clearTimeout(imeTimer);const el=document.getElementById('answer'),status=M.textStatus(el.value,target(),s.composing);s.errorFeedback=status==='error';if(status==='error'){s.errors=Math.max(s.errors,1);s.feedback='這裡還沒對上，請退格修改。';}else s.feedback=status==='complete'?'已輸入完整答案。':s.composing?'正在組字…':'';paint();if(status==='complete'){const active=s,t=target();imeTimer=setTimeout(()=>{if(s===active&&!s.paused&&document.getElementById('answer')?.value.normalize('NFC')===t)nativeDone();},s.composing?850:400);}}
function nativeDone(){if(!s||s.paused||s.transitioning)return;clearTimeout(imeTimer);tick();if(s.mode==='guide'){guideDone();return;}record({key:keyMode()?s.tokens[0]:null,itemKey:s.item?.key||'',clean:!s.hinted&&!s.errors,hinted:s.hinted,errors:s.errors,ms:s.elapsed-s.stepStart});done();}
function physical(token){if(!s||s.paused||s.transitioning||input!=='physical')return;tick();if(token!==s.tokens[s.cursor]){s.errors++;s.feedback='這個位置還沒對上，再試一次。';s.errorFeedback=true;paint();return;}if(s.mode==='guide'){guideDone();return;}const prior=s.results[s.cursor],k=s.tokens[s.cursor];s.results[s.cursor]={key:C.isLetter(k)?k:null,itemKey:'',clean:!s.hinted&&!s.errors&&(!prior||prior.clean),hinted:s.hinted||!!prior?.hinted,errors:s.errors+(prior?.errors||0),ms:prior?.ms??s.elapsed-s.stepStart};s.cursor++;s.errors=0;s.hinted=false;s.stepStart=s.elapsed;s.feedback='';s.errorFeedback=false;if(s.cursor===s.tokens.length){for(const e of s.results)if(e.key)record(e);if(s.item)record({key:null,itemKey:s.item.key,clean:s.results.every(e=>e.clean),hinted:s.results.some(e=>e.hinted),errors:s.results.reduce((n,e)=>n+e.errors,0),ms:s.results.reduce((n,e)=>n+(e.ms||0),0)});done();}else paint();}
function tick(){if(!s)return;const now=performance.now();if(!s.paused&&s.mode!=='guide')s.elapsed=Math.min(s.minutes*60000,s.elapsed+Math.max(0,now-s.lastTick));s.lastTick=now;s.expired=s.mode!=='guide'&&s.elapsed>=s.minutes*60000;const el=document.getElementById('timer');if(el)el.textContent=s.mode==='guide'?'跟著輸入・不計時':time(s.elapsed)+' / '+s.minutes+':00'+(s.expired?' · 完成當題後結算':'');}
function pause(){if(!s||s.paused)return;tick();s.paused=true;clearTimeout(imeTimer);paint();document.getElementById('answer')?.blur();window.HangulAndroid?.hideKeyboard?.();}
function resume(){if(!s)return;s.paused=false;s.lastTick=performance.now();paint();focus();if(input==='native'&&document.getElementById('answer').value)nativeInput();}
function finish(show=true){if(!s)return;tick();clearTimeout(imeTimer);if(!s.transitioning&&s.mode!=='guide'&&(s.errors||s.hinted||s.cursor>0||(input==='native'&&document.getElementById('answer')?.value))){if(input==='physical'){for(const e of s.results.slice(0,s.cursor))if(e?.key)record(e);}const k=keyMode()?s.tokens[0]:null;record({key:k,itemKey:s.item?.key||'',clean:false,hinted:s.hinted,errors:s.errors,ms:null});}persist();last={...s,events:s.events.slice()};s=null;window.HangulAndroid?.hideKeyboard?.();if(show){route='result';render();}}
function result(){if(!last){route='home';home();return;}const c=counts(last);shell('<section class="panel section-box result-hero"><h2>這一小步，已經留下來了。</h2><p>'+modes[last.mode]+' · '+(last.inputMode==='native'?'手機文字輸入':'電腦實體鍵盤')+'</p><div class="result-values"><div><strong>'+last.questions+'</strong><span>完成題目</span></div><div><strong>'+pct(c.clean,c.n)+'</strong><span>首次無提示完成</span></div><div><strong>'+time(last.elapsed)+'</strong><span>有效時間</span></div></div><p>提示／錯誤後完成分開記錄，未完成題目不冒算答對。</p><div class="result-actions">'+btn('再練一小回合','data-action="again"')+btn('已學鍵位混練','data-route="mixed"',true)+btn('匯出完整備份','data-action="export"',true)+'</div></section>','每一次練習，都算數。');}
function exportBackup(){if(s)finish();save();const text=M.backup(state),name='韓文完整備份_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';if(window.HangulAndroid){window.HangulAndroid.exportJson(name,text);return;}const url=URL.createObjectURL(new Blob([text],{type:'application/json;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('已準備下載完整備份，請保留JSON檔。');}
function openFile(kind){if(s)pause();expect=kind;if(window.HangulAndroid)window.HangulAndroid.importJson();else file.click();}
function receive(text){try{const p=M.parse(text,D.groups);if((expect==='pack')!==(p.kind==='pack'))throw Error(expect==='pack'?'這是成績備份，請用「匯入完整備份」。':'這是題庫包，請用「匯入題庫」。');let copy=JSON.parse(JSON.stringify(state)),desc;if(p.kind==='pack'){const info=M.addPack(copy,p.value);desc=esc(p.value.title)+'：'+p.value.items.length+'項，'+(info.skipped?'已安裝此版本。':'驗證通過，將加入題庫。');}else{const info=M.merge(copy,p.value,D.groups);copy=info.state;desc='新增 '+info.added+' 個回合，排除 '+info.duplicates+' 個重複回合，題庫一併恢復。'+(p.kind==='legacy'?'舊版作歷史基準保留。':'');}pending=copy;const el=document.createElement('div');el.className='modal-backdrop';el.innerHTML='<section class="modal" role="dialog" aria-modal="true" aria-labelledby="import-title"><h2 id="import-title">匯入前確認</h2><p>'+desc+'</p><div class="actions">'+btn('取消','data-action="cancel-import"',true)+btn('確認匯入','data-action="confirm-import"')+'</div></section>';app.appendChild(el);el.querySelector('button').focus();}catch(e){toast(e.message);}}
async function update(){if(s)pause();toast('正在取得最新日課題庫…');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);try{const res=await fetch(URL_BASE+'latest.json',{signal:controller.signal,cache:'no-store'});if(!res.ok)throw Error();const index=await res.json();if(index.kind!=='hangul-content-index'||index.version!==1||!Array.isArray(index.packs)||index.packs.length>20)throw Error();const copy=JSON.parse(JSON.stringify(state));let count=0;for(const e of index.packs){if(!/^[a-z0-9_-]+\.json$/.test(e.url)||!/^[a-f0-9]{64}$/.test(e.sha256))throw Error();const response=await fetch(URL_BASE+e.url,{signal:controller.signal,cache:'no-store'});if(!response.ok)throw Error();const bytes=await response.arrayBuffer();if(bytes.byteLength>5e6)throw Error();const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(x=>x.toString(16).padStart(2,'0')).join('');if(hash!==e.sha256)throw Error();const p=M.pack(JSON.parse(new TextDecoder().decode(bytes)));if(p.packId!==e.packId||p.revision!==e.revision)throw Error();if(!M.addPack(copy,p).skipped)count++;}state=copy;save();catalog();route='library';render();toast(count?'題庫已更新，原有成績保留。':'已是最新題庫。');}catch{toast('暫時無法更新，原題庫與成績保留；可重試或匯入離線題庫包。');}finally{clearTimeout(timer);}}

function paint(fresh=false){if(!s)return;document.getElementById('step-name').textContent=modes[s.mode];document.getElementById('question-label').textContent=s.mode==='guide'?'先看看位置，跟著輸入。':keyMode()?'這個字母，在哪個位置？':'照著目標輸入完整詞句。';const t=document.getElementById('target-text');t.textContent=target();t.className='kr '+(keyMode()?'target-glyph':'target-word');document.getElementById('meaning').textContent=s.item?.meaning||'';const k=s.tokens[Math.min(s.cursor,s.tokens.length-1)];document.getElementById('hint-area').innerHTML=s.mode==='guide'||s.hinted?'<p class="mapping"><span class="kr">'+esc(C.KEYMAP[k])+'</span> → <kbd>'+esc(C.label(k))+'</kbd></p><p class="subtitle">'+s.tokens.map(k=>esc(C.KEYMAP[k])).join(' · ')+'</p>':'';const f=document.getElementById('feedback');f.textContent=s.feedback||'';f.classList.toggle('error',!!s.errorFeedback);const p=document.getElementById('preview');if(p)p.textContent=keyMode()?'':C.compose(s.tokens.slice(0,s.cursor));const a=document.getElementById('answer');if(a){a.disabled=s.paused||s.transitioning;if(fresh){a.value='';s.composing=false;}}document.getElementById('pause-area').innerHTML=s.paused?'<div class="pause-layer"><h2>休息一下，沒關係。</h2><p>計時已暫停。</p>'+btn('繼續練習','data-action="resume"')+'<button data-action="finish" class="text-btn">結束這一回合</button></div>':'';tick();}
function next(){clearTimeout(imeTimer);Object.assign(s,{cursor:0,results:[],errors:0,hinted:false,feedback:'',errorFeedback:false,transitioning:false,stepStart:s.elapsed,composing:false});if(s.mode==='guide')s.tokens=[s.queue[s.guideIndex]];else if(['keys','mixed'].includes(s.mode)){const keys=s.mode==='mixed'?s.mixKeys:D.groups.find(g=>g.id===s.groupId).keys,min=Math.min(...keys.map(k=>s.counts[k]||0)),pool=keys.filter(k=>(s.counts[k]||0)<=min+1);const k=C.chooseKey(pool,stats().keys,s.counts,s.previous);s.tokens=[k];s.previous=k;}else{let pool=s.pool.filter(x=>x.key!==s.item?.key);if(!pool.length)pool=s.pool;const st=stats().items,w=pool.map(x=>{const a=st[x.key];return 1+(a?.attempts?4*(1-a.firstCorrect/a.attempts)+a.hinted/a.attempts:3)+(x.lessonDate===s.latest?1:0);});let n=Math.random()*w.reduce((a,b)=>a+b,0),i=0;while(i<pool.length-1&&(n-=w[i])>0)i++;s.item=pool[i];s.tokens=s.item.tokens;}}
function start(mode,gid,ik){if(s)finish(false);catalog();const g=D.groups.find(g=>g.id===gid)||suggested(),item=items.find(x=>x.key===ik);if(item)mode=item.type;const pool=item?[item]:items.filter(x=>x.type===mode&&(!chapter||x.chapters.includes(chapter))),ids=(selection||knownGroups().map(g=>g.id)).filter(x=>state.guides.includes(x));if(mode==='mixed'&&!ids.length){route='mixed';render();toast('先完成一組導學，再選已學組別。');return;}if(['words','sentences'].includes(mode)&&!pool.length)return;const queue=[];if(mode==='guide')for(let i=0;i<g.keys.length;i+=2)queue.push(...g.keys.slice(i,i+2),...g.keys.slice(i,i+2));s={id:M.id(),at:new Date().toISOString(),inputMode:input,mode,groupId:['guide','keys'].includes(mode)?g.id:null,pool,pinned:ik,queue,guideIndex:0,guidePresses:0,elapsed:0,lastTick:performance.now(),minutes:state.settings.minutes,paused:false,events:[],questions:0,counts:{},mixKeys:M.mixedKeys(D.groups,ids),previous:'',latest:pool.map(x=>x.lessonDate).sort().at(-1)||''};next();route='practice';practice();}

function exportBackup(){if(s)finish();save();const text=M.backup(state),name='韓文完整備份_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';if(window.HangulAndroid){window.HangulAndroid.exportJson(name,text);return;}const url=URL.createObjectURL(new Blob([text],{type:'application/json;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('已準備下載完整備份，請保留JSON檔。');}
function openFile(kind){if(s)pause();expect=kind;if(window.HangulAndroid)window.HangulAndroid.importJson();else file.click();}
function receive(text){try{const p=M.parse(text,D.groups);if((expect==='pack')!==(p.kind==='pack'))throw Error(expect==='pack'?'這是成績備份，請用「匯入完整備份」。':'這是題庫包，請用「匯入題庫」。');let copy=JSON.parse(JSON.stringify(state)),desc;if(p.kind==='pack'){const info=M.addPack(copy,p.value);desc=esc(p.value.title)+'：'+p.value.items.length+'項，'+(info.skipped?'已安裝此版本。':'驗證通過，將加入題庫。');}else{const info=M.merge(copy,p.value,D.groups);copy=info.state;desc='新增 '+info.added+' 個回合，排除 '+info.duplicates+' 個重複回合，題庫一併恢復。'+(p.kind==='legacy'?'舊版作歷史基準保留。':'');}pending=copy;const el=document.createElement('div');el.className='modal-backdrop';el.innerHTML='<section class="modal" role="dialog" aria-modal="true" aria-labelledby="import-title"><h2 id="import-title">匯入前確認</h2><p>'+desc+'</p><div class="actions">'+btn('取消','data-action="cancel-import"',true)+btn('確認匯入','data-action="confirm-import"')+'</div></section>';app.appendChild(el);el.querySelector('button').focus();}catch(e){toast(e.message);}}
async function update(){if(s)pause();toast('正在取得最新日課題庫…');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);try{const res=await fetch(URL_BASE+'latest.json',{signal:controller.signal,cache:'no-store'});if(!res.ok)throw Error();const index=await res.json();if(index.kind!=='hangul-content-index'||index.version!==1||!Array.isArray(index.packs)||index.packs.length>20)throw Error();const copy=JSON.parse(JSON.stringify(state));let count=0;for(const e of index.packs){if(!/^[a-z0-9_-]+\.json$/.test(e.url)||!/^[a-f0-9]{64}$/.test(e.sha256))throw Error();const response=await fetch(URL_BASE+e.url,{signal:controller.signal,cache:'no-store'});if(!response.ok)throw Error();const bytes=await response.arrayBuffer();if(bytes.byteLength>5e6)throw Error();const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(x=>x.toString(16).padStart(2,'0')).join('');if(hash!==e.sha256)throw Error();const p=M.pack(JSON.parse(new TextDecoder().decode(bytes)));if(p.packId!==e.packId||p.revision!==e.revision)throw Error();if(!M.addPack(copy,p).skipped)count++;}state=copy;save();catalog();route='library';render();toast(count?'題庫已更新，原有成績保留。':'已是最新題庫。');}catch{toast('暫時無法更新，原題庫與成績保留；可重試或匯入離線題庫包。');}finally{clearTimeout(timer);}}
window.HangulFiles={receiveBase64:x=>receive(new TextDecoder().decode(Uint8Array.from(atob(x),c=>c.charCodeAt(0)))),notice:toast,pause};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.route){if(s)finish(false);route=b.dataset.route;render();return;}if(b.dataset.mode){if(s)finish(false);input=b.dataset.mode;try{localStorage.setItem('hangul-one-step.input.v2',input);}catch{}render();return;}if(b.dataset.start){start(b.dataset.start,b.dataset.group);return;}if(b.dataset.item){start(null,null,b.dataset.item);return;}if(b.dataset.tab){tab=b.dataset.tab;render();return;}const a=b.dataset.action;if(a==='hint'&&s&&!s.paused&&!s.transitioning){s.hinted=true;s.feedback='對照已顯示，下次再自己回想。';paint();focus();}else if(a==='pause')pause();else if(a==='resume')resume();else if(a==='finish')finish();else if(a==='again'&&last)start(last.mode,last.groupId,last.pinned);else if(a==='export')exportBackup();else if(a==='import-pack')openFile('pack');else if(a==='import-backup')openFile('backup');else if(a==='update')update();else if(a==='cancel-import'){pending=null;b.closest('.modal-backdrop').remove();}else if(a==='confirm-import'&&pending){state=pending;pending=null;blocked=false;save();catalog();route='progress';render();toast('匯入完成，新版回合已合併去重。');}});
document.addEventListener('change',e=>{if(e.target.id==='minutes'){state.settings.minutes=+e.target.value;save();}else if(e.target.id==='chapter'){chapter=e.target.value;render();}else if(e.target.dataset.mix){const id=e.target.dataset.mix;selection=e.target.checked?[...new Set([...(selection||[]),id])]:selection.filter(x=>x!==id);document.getElementById('mix-count').textContent='已選 '+M.mixedKeys(D.groups,selection).length+' 個鍵位組合';app.querySelector('[data-start="mixed"]').disabled=!selection.length;}});
file.addEventListener('change',async()=>{const f=file.files[0];file.value='';if(!f)return;if(f.size>25*1024*1024){toast('檔案超過25MB，原資料保留。');return;}receive(await f.text());});
document.addEventListener('keydown',e=>{if(pending){if(e.key==='Escape'){pending=null;document.querySelector('.modal-backdrop')?.remove();}return;}if(!s)return;if(e.key==='Escape'){e.preventDefault();s.paused?resume():pause();return;}if(input!=='physical'||s.paused||s.transitioning||e.target.matches('input,textarea,select'))return;if(e.code==='Backspace'){e.preventDefault();if(s.cursor>0){s.cursor--;s.errors=0;s.hinted=false;paint();}return;}const token=C.eventToken(e);if(token!==null){e.preventDefault();physical(token);}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});window.addEventListener('beforeunload',()=>{if(s){tick();persist();}});setInterval(tick,250);catalog();render();save();
})();

</script>
