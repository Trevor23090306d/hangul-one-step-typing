/* Quiet, readable layout for the simplified practice and ranking pages. */
:root{--muted:#68776c;--shadow:none}
body{font-size:15px;line-height:1.6}
button,input,select{line-height:1.4}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #87a992;outline-offset:3px}
.shell{grid-template-columns:210px minmax(0,1fr)}
.sidebar{padding:30px 20px;background:#f9f9f2}
.brand{margin-bottom:35px;padding:0 5px;gap:11px}
.brand strong{font-size:18px;letter-spacing:0}
.brand small{font-size:13px;letter-spacing:0}
.nav{gap:6px}
.nav button{min-height:46px;padding:11px 13px;font-size:15px;gap:11px;color:#65746a}
.nav .number{font-size:13px}
.sidebar-foot{padding:20px 5px 0}
.storage,.text-btn,.side-note{font-size:13px;line-height:1.7}
.backup-actions{flex-wrap:wrap;gap:10px 14px}
.main{max-width:1260px;padding:38px 42px 48px}
.page-heading{margin:0 0 25px;align-items:center}
.page-heading h1{font-size:30px;font-weight:600;letter-spacing:0;line-height:1.4}
.subtitle{font-size:15px;margin-top:8px;line-height:1.7}
.panel{border-radius:15px;box-shadow:none}
.workspace{gap:22px}
.button{min-height:44px;font-size:15px;padding:11px 18px;border-radius:9px;font-weight:550}
.button.small{min-height:40px;font-size:14px;padding:8px 13px}
.button.ghost{color:var(--muted)}
select{min-height:40px;font-size:14px;padding:8px 10px}
.input-choice{gap:12px;margin:0 0 22px;font-size:14px}
.input-choice small{font-size:13px;color:var(--muted)}
.input-choice .segmented button{font-size:14px;min-height:38px;padding:8px 13px}
.segmented{border-radius:10px;background:#eef1e8}
.segmented button{font-size:14px;min-height:40px;padding:8px 15px}
.segmented button.selected{box-shadow:none}
.start-panel{padding:28px;min-height:0}
.start-panel h2{font-size:24px;font-weight:550;line-height:1.5;margin:0 0 12px}
.start-panel p{margin:10px 0;font-size:15px;line-height:1.7}
.start-summary{display:flex;align-items:center;flex-wrap:wrap;gap:10px 22px;color:var(--muted);font-size:15px;margin:0 0 24px}
.start-summary p{margin:0}
.start-summary strong{color:var(--ink);font-weight:550}
.start-panel .card-footer{margin-top:24px;padding-top:20px;gap:16px}
.duration{font-size:14px;gap:10px}
.subtle{color:var(--muted);font-size:14px;line-height:1.7}
.rank-card{padding:23px 25px;background:var(--paper);border:1px solid var(--line);border-radius:14px;text-align:left}
.rank-card h2,.rank-card h3{font-size:18px;font-weight:550;line-height:1.5;margin:0 0 15px}
.rank-card p{font-size:14px;line-height:1.7;margin:10px 0;color:var(--muted)}
.rank-list{list-style:none;margin:0;padding:0}
.rank-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;min-height:54px;padding:8px 2px;border-top:1px solid var(--line)}
.rank-list li:first-child{border-top:0}
.rank-list .kr{font-size:30px;line-height:1.2;color:#355741;font-weight:400}
.rank-list strong{font-size:18px;font-weight:550;font-variant-numeric:tabular-nums;text-align:right;color:var(--ink)}
.rank-list small{font-size:13px;color:var(--muted)}
.record-tools{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;margin:20px 0}
.record-tools .subtle{margin:0}
.compact-details{font-size:14px;line-height:1.7;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.compact-details summary{cursor:pointer;width:fit-content;color:var(--green);font-size:14px;padding:4px 0}
.compact-details[open] summary{margin-bottom:14px}
.compact-details p{font-size:14px;line-height:1.8;color:var(--muted)}
.compact-details .record-tools{margin-bottom:0}
.section-box{padding:26px}
.section-box h2{font-size:20px;font-weight:550}
.section-label,.aside-card p,.card-top,.pill,.timer{font-size:13px;letter-spacing:0}
.aside-card h3{font-size:16px}
.question-label{font-size:14px;letter-spacing:0;margin-bottom:12px}
.meaning{font-size:15px;color:var(--muted);margin:8px 0;line-height:1.7}
.mapping{font-size:15px;gap:10px}
.mapping kbd{font-size:14px}
.feedback{height:auto;min-height:24px;font-size:14px;line-height:1.6;margin-top:12px}
.practice-card{padding:25px 28px;min-height:440px}
.practice-actions{gap:14px;padding-top:18px}
.action-left{gap:9px}
.native-label{font-size:14px;margin:14px 0 8px}
.native-answer{font-size:30px;min-height:58px;border-color:#a6bea5;background:#fbfcf7;line-height:1.4}
.native-answer:focus{outline:3px solid #87a992;outline-offset:3px;background:#fffefa}
.composition-note{font-size:13px;line-height:1.7;color:var(--muted);max-width:620px}
.pause-layer p{font-size:15px;line-height:1.7}
.pause-layer h2{font-size:25px}
.keyboard-heading,.keyboard-caption,.kbd-tip{font-size:13px;letter-spacing:0}
.key small{font-size:11px;color:#73806d}
.key.shift,.key.space{font-size:11px;color:#73806d}
.groups-grid{gap:18px}
.group-card{padding:24px}
.group-card h2{font-size:20px;font-weight:550}
.group-card p{font-size:15px;line-height:1.7}
.group-glyphs{font-size:32px;gap:15px;margin:20px 0}
.source-pill,.source-detail,.source-note,.notice{font-size:13px;line-height:1.7}
.library-heading{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px 20px;margin-bottom:20px}
.library-heading h2{font-size:20px;font-weight:550;margin:0}
.library-heading p{font-size:14px;color:var(--muted);margin:0}
.library-toolbar{margin-bottom:22px}
.library-grid{gap:16px}
.word-card{padding:22px;min-height:175px;gap:10px}
.word-card h2{font-size:30px;line-height:1.4}
.word-card.sentence h2{font-size:25px;line-height:1.6}
.word-card p,.word-card .needed{font-size:14px;line-height:1.7}
.word-card .word-action{font-size:13px;gap:12px;padding-top:10px}
.library-pager{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px 20px;margin-top:25px;font-size:14px;color:var(--muted)}
.library-pager .button{min-width:88px}
.result-hero{padding:28px;max-width:880px;text-align:left}
.result-hero h2{font-size:26px;line-height:1.5;margin:0 0 10px}
.result-hero>p{font-size:15px;line-height:1.7;margin:10px 0 22px}
.result-hero>.rank-card{margin:22px 0}
.result-actions{justify-content:flex-start;gap:12px}
.metrics{gap:16px}
.metric .label,.session-stats small,.stat-key small{font-size:13px}
table{font-size:14px}
th{font-size:13px;padding-bottom:12px;color:var(--muted)}
td{padding:15px 12px;color:#536c59}
.empty{font-size:15px;line-height:1.8;padding:28px 18px}
.modal p,.toast{font-size:14px;line-height:1.7}
.modal{border:1px solid var(--line);border-radius:15px;box-shadow:0 18px 50px #213c3418}
.mix-options label{font-size:15px;padding:15px}
.touch-keyboard-head,.touch-caption{font-size:13px;line-height:1.5}
.touch-shift small{font-size:11px}
.touch-key{min-height:48px}
.touch-mode.practicing .feedback{height:auto;min-height:24px;font-size:14px;line-height:1.6}
.touch-mode.practicing .meaning{font-size:14px}

@media(max-width:1180px){
  .shell{grid-template-columns:190px minmax(0,1fr)}
  .sidebar{padding:28px 14px}
  .main{padding:30px 28px 40px}
  .workspace{grid-template-columns:minmax(0,1fr) 210px}
}

  .compact-details{margin-top:22px}

function exportBackup(){if(s)finish();save();const text=M.backup(state),name='韓文完整備份_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';if(window.HangulAndroid){window.HangulAndroid.exportJson(name,text);return;}const url=URL.createObjectURL(new Blob([text],{type:'application/json;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('已準備下載完整備份，請保留JSON檔。');}
function openFile(kind){if(s)pause();expect=kind;if(window.HangulAndroid)window.HangulAndroid.importJson();else file.click();}
function receive(text){try{const p=M.parse(text,D.groups);if((expect==='pack')!==(p.kind==='pack'))throw Error(expect==='pack'?'這是成績備份，請用「匯入完整備份」。':'這是題庫包，請用「匯入題庫」。');let copy=JSON.parse(JSON.stringify(state)),desc;if(p.kind==='pack'){const info=M.addPack(copy,p.value);desc=esc(p.value.title)+'：'+p.value.items.length+'項，'+(info.skipped?'已安裝此版本。':'驗證通過，將加入題庫。');}else{const info=M.merge(copy,p.value,D.groups);copy=info.state;desc='新增 '+info.added+' 個回合，排除 '+info.duplicates+' 個重複回合，題庫一併恢復。'+(p.kind==='legacy'?'舊版作歷史基準保留。':'');}pending=copy;const el=document.createElement('div');el.className='modal-backdrop';el.innerHTML='<section class="modal" role="dialog" aria-modal="true" aria-labelledby="import-title"><h2 id="import-title">匯入前確認</h2><p>'+desc+'</p><div class="actions">'+btn('取消','data-action="cancel-import"',true)+btn('確認匯入','data-action="confirm-import"')+'</div></section>';app.appendChild(el);el.querySelector('button').focus();}catch(e){toast(e.message);}}
async function update(){if(s)pause();toast('正在取得最新日課題庫…');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);try{const res=await fetch(URL_BASE+'latest.json',{signal:controller.signal,cache:'no-store'});if(!res.ok)throw Error();const index=await res.json();if(index.kind!=='hangul-content-index'||index.version!==1||!Array.isArray(index.packs)||index.packs.length>20)throw Error();const copy=JSON.parse(JSON.stringify(state));let count=0;for(const e of index.packs){if(!/^[a-z0-9_-]+\.json$/.test(e.url)||!/^[a-f0-9]{64}$/.test(e.sha256))throw Error();const response=await fetch(URL_BASE+e.url,{signal:controller.signal,cache:'no-store'});if(!response.ok)throw Error();const bytes=await response.arrayBuffer();if(bytes.byteLength>5e6)throw Error();const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(x=>x.toString(16).padStart(2,'0')).join('');if(hash!==e.sha256)throw Error();const p=M.pack(JSON.parse(new TextDecoder().decode(bytes)));if(p.packId!==e.packId||p.revision!==e.revision)throw Error();if(!M.addPack(copy,p).skipped)count++;}state=copy;save();catalog();route='library';render();toast(count?'題庫已更新，原有成績保留。':'已是最新題庫。');}catch{toast('暫時無法更新，原題庫與成績保留；可重試或匯入離線題庫包。');}finally{clearTimeout(timer);}}
window.HangulFiles={receiveBase64:x=>receive(new TextDecoder().decode(Uint8Array.from(atob(x),c=>c.charCodeAt(0)))),notice:toast,pause};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.route){if(s)finish(false);route=b.dataset.route;render();return;}if(b.dataset.mode){if(input===b.dataset.mode)return;const focused=document.activeElement===b;if(s)finish(false);input=b.dataset.mode;try{localStorage.setItem('hangul-one-step.input.v2',input);}catch{}render();if(focused)document.getElementById('mode-'+input)?.focus({preventScroll:true});if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.getElementById('mode-switch')?.classList.add('switching');return;}if(b.dataset.start){start(b.dataset.start,b.dataset.group);return;}if(b.dataset.item){start(null,null,b.dataset.item);return;}if(b.dataset.tab){tab=b.dataset.tab;libraryPage=0;render();return;}if(b.dataset.page!==undefined){libraryPage=Number(b.dataset.page)||0;render();return;}if(b.dataset.rankDays){rankDays=b.dataset.rankDays==='all'?null:7;render();return;}const a=b.dataset.action;if(a==='hint'&&s&&!s.paused&&!s.transitioning){s.hinted=true;s.feedback='對照已顯示，下次再自己回想。';paint();focus();}else if(a==='pause')pause();else if(a==='resume')resume();else if(a==='finish')finish();else if(a==='again'&&last)start(last.mode,last.groupId,last.pinned);else if(a==='export')exportBackup();else if(a==='import-pack')openFile('pack');else if(a==='import-backup')openFile('backup');else if(a==='update')update();else if(a==='cancel-import'){pending=null;b.closest('.modal-backdrop').remove();}else if(a==='confirm-import'&&pending){state=pending;pending=null;blocked=false;save();catalog();route='progress';render();toast('匯入完成，新版回合已合併去重。');}});
document.addEventListener('change',e=>{if(e.target.id==='minutes'){state.settings.minutes=+e.target.value;save();}else if(e.target.id==='chapter'){chapter=e.target.value;libraryPage=0;render();}else if(e.target.dataset.mix){const id=e.target.dataset.mix;selection=e.target.checked?[...new Set([...(selection||[]),id])]:selection.filter(x=>x!==id);document.getElementById('mix-count').textContent='已選 '+M.mixedKeys(D.groups,selection).length+' 個字母';app.querySelector('[data-start="mixed"]').disabled=!selection.length;}});
file.addEventListener('change',async()=>{const f=file.files[0];file.value='';if(!f)return;if(f.size>25*1024*1024){toast('檔案超過25MB，原資料保留。');return;}receive(await f.text());});
document.addEventListener('keydown',e=>{if(pending){if(e.key==='Escape'){pending=null;document.querySelector('.modal-backdrop')?.remove();}return;}if(!s)return;if(e.key==='Escape'){e.preventDefault();s.paused?resume():pause();return;}if(input!=='physical'||s.paused||s.transitioning||e.target.matches('input,textarea,select'))return;if(e.code==='Backspace'){e.preventDefault();if(s.cursor>0){s.cursor--;s.errors=0;s.hinted=false;paint();}return;}const token=C.eventToken(e);if(token!==null){e.preventDefault();physical(token);}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});window.addEventListener('beforeunload',()=>{if(s){tick();persist();}});setInterval(tick,250);catalog();render();save();
})();

</script>
