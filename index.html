/* 2.1.1: readable Song-style interface and a quiet, elastic mode selector. */
:root{
  --muted:#68796d;
  --ui-serif:"Hangul UI Serif","Noto Serif TC","Source Han Serif TC","Songti TC","SimSun",serif;
  font-family:var(--ui-serif);
  font-size:18px;
  font-weight:500;
  line-height:1.75;
}
button,select,input,textarea{font-family:inherit}
.kr{font-family:"Malgun Gothic","Noto Sans KR","Apple SD Gothic Neo",sans-serif}
.page-heading h1{font-size:32px;font-weight:700;line-height:1.5;letter-spacing:.04em}
.brand{margin-bottom:42px;gap:13px}
.brand strong{font-size:21px;font-weight:700;line-height:1.5;letter-spacing:.02em}
.brand-mark{font-size:26px}
.nav{gap:10px}
.nav button{font-family:var(--ui-serif);font-size:17px;font-weight:500;line-height:1.65;min-height:52px;padding:12px 14px;color:#536b5e;letter-spacing:.025em}
.nav button.active{font-weight:700;color:#294e3c}
.sidebar-foot{padding-top:25px}
.sidebar-foot p{font-size:16px;font-weight:500;line-height:1.8;margin:0 0 16px;color:#5d7164}
.sidebar-foot .text-btn{font-size:16px;font-weight:600;line-height:1.75;padding:7px 0}
.button{font-size:17px;font-weight:600;line-height:1.6;min-height:48px;padding:11px 21px;border-radius:11px}
.button.small{font-size:15px;min-height:43px}
.text-btn{font-size:16px;font-weight:500;line-height:1.6}
select{font-size:17px;font-weight:500;line-height:1.6;padding:9px 12px;min-height:46px}
.input-choice{margin-bottom:28px}
.input-choice .mode-switch{
  position:relative;isolation:isolate;display:grid;grid-template-columns:1fr 1fr;
  width:328px;max-width:100%;gap:0;padding:5px;border-radius:14px;
  background:#edf0e7;border:1px solid #dce3d7;
}
.mode-switch::before{
  content:"";position:absolute;z-index:0;top:5px;bottom:5px;left:5px;
  width:calc((100% - 10px)/2);border-radius:9px;background:var(--paper);
  box-shadow:0 2px 7px #2a4d3710;transform:translateX(0);
  transition:transform 440ms cubic-bezier(.22,1.32,.36,1);
}
.mode-switch[data-input="physical"]::before{transform:translateX(100%)}
.mode-switch.switching[data-input="physical"]::before{animation:mode-to-physical 440ms cubic-bezier(.2,.75,.3,1) both}
.mode-switch.switching[data-input="native"]::before{animation:mode-to-native 440ms cubic-bezier(.2,.75,.3,1) both}
@keyframes mode-to-physical{0%{transform:translateX(0)}75%{transform:translateX(103%)}100%{transform:translateX(100%)}}
@keyframes mode-to-native{0%{transform:translateX(100%)}75%{transform:translateX(-3%)}100%{transform:translateX(0)}}
.input-choice .mode-switch button{
  position:relative;z-index:1;background:transparent;box-shadow:none;
  font-family:var(--ui-serif);font-size:16px;font-weight:500;line-height:1.6;
  min-height:46px;padding:9px 12px;color:#67796b;border-radius:9px;
  transition:color 180ms ease;
}
.input-choice .mode-switch button.selected{background:transparent;box-shadow:none;color:#294e3c;font-weight:600}
.mode-switch button:focus-visible{outline-offset:0}
.start-panel{padding:30px}
.start-summary{gap:12px 26px;margin-bottom:30px;align-items:baseline}
.start-panel h2{font-size:25px;font-weight:600;line-height:1.7;margin:0}
.start-panel p{font-size:17px;font-weight:500;line-height:1.8;margin:0;color:#6a7a6d}
.start-panel .group-actions{gap:14px;margin:0 0 25px}
.start-panel .duration{font-size:17px;line-height:1.8;gap:15px;min-height:46px}
.start-panel .duration select{margin-left:0}
.group-card h2,.section-box h2{font-size:22px;font-weight:600;line-height:1.65}
.group-card p,.word-card p,.subtle,.compact-details,.compact-details p,.compact-details li{font-size:16px;line-height:1.85;color:#657669}
.group-card .pill,.pill,.timer,.question-label,.meaning,.feedback,.native-label{font-size:16px;line-height:1.65}
.feedback{height:auto;min-height:26px}
.word-card .kr{color:var(--ink)}
.library-toolbar .segmented button,.record-tools button{font-size:16px;line-height:1.6;padding:9px 16px}
.library-toolbar+.group-actions{margin-bottom:22px}
.result-actions{margin-top:22px}
.library-pager{font-size:16px;line-height:1.7}
.compact-details summary{font-size:17px;line-height:1.8;font-weight:500}
.mix-options label{font-size:17px;line-height:1.8}
.toast,.notice,.modal p,table{font-size:16px;line-height:1.8}
th{font-size:15px}
.rank-list strong{font-family:var(--ui-serif);font-size:19px;font-weight:600}

  .native-mode.practicing .input-choice .mode-switch button{font-size:15px;min-height:38px;padding:7px}
  .native-mode.practicing .question-label,.native-mode.practicing .meaning,.native-mode.practicing .feedback,.native-mode.practicing .native-label,.native-mode.practicing .pill,.native-mode.practicing .timer{font-size:14px;line-height:1.5}

function progress(){const rs=state.sessions.filter(r=>r.inputMode===input),rows=M.mistakeRanking(state.sessions,{inputMode:input,days:rankDays});shell('<div class="record-tools segmented" aria-label="排行時間範圍"><button data-rank-days="7" class="'+(rankDays===7?'selected':'')+'" aria-pressed="'+(rankDays===7)+'">近七天</button><button data-rank-days="all" class="'+(rankDays===null?'selected':'')+'" aria-pressed="'+(rankDays===null)+'">全部</button></div>'+rankingCard(rows,'錯字排行','還沒有字母錯誤紀錄。')+'<details class="compact-details"><summary>統計說明</summary><p>每次可辨識的錯輸，記在本來應輸入的字母。提示和退格不計，正常組字不重複計。手機依輸入變化記次，不能直接讀取系統鍵盤的觸控。</p><p>手機與電腦分開記錄。新明細從2.1.0開始，舊回合保留為歷史摘要。</p></details><details class="compact-details"><summary>最近回合</summary><div class="table-wrap"><table><thead><tr><th>時間</th><th>練習</th><th>完成題</th><th>用時</th></tr></thead><tbody>'+rs.slice(-30).reverse().map(r=>'<tr><td>'+esc(new Date(r.at).toLocaleString('zh-HK'))+'</td><td>'+modes[r.mode]+'</td><td>'+r.questions+'</td><td>'+time(r.elapsed)+'</td></tr>').join('')+'</tbody></table></div><p>舊版摘要：'+rs.filter(r=>r.mistakes===null).length+' 回合'+(state.legacy?'，另保留 '+state.legacy.sessions.length+' 個v1回合':'')+'。</p></details><details class="compact-details"><summary>備份與還原</summary><div class="group-actions">'+btn('匯出完整備份','data-action="export"')+btn('匯入完整備份','data-action="import-backup"',true)+'</div><p>完整備份包含紀錄與題庫；新版備份請用2.1.0或之後版本匯入。</p></details>','練習紀錄');}
function render(){flushUpdates();if(s&&route==='practice')practice();else if(route==='groups')groups();else if(route==='mixed')mixed();else if(route==='library')library();else if(route==='progress')progress();else if(route==='result')result();else home();}
const keyMode=()=>['guide','keys','mixed'].includes(s.mode),target=()=>keyMode()?C.KEYMAP[s.tokens[0]]:s.item.text;
function focus(){if(s&&input==='native'&&!s.paused){document.getElementById('answer')?.focus({preventScroll:true});window.HangulAndroid?.showKeyboard?.();}}
// Each key question owns its editor, so closing an old IME composition cannot score a new question.
function bindAnswer(el,previous=''){
 const active=s,q=keyMode()?s.question:null;let started=false,oldCommit=false;
 const live=()=>s===active&&(q===null||s.question===q)&&document.getElementById('answer')===el&&!s.paused&&!s.transitioning&&!s.handingOver;
 el.dataset.bound='true';el.dataset.question=String(s.question);
 el.addEventListener('compositionstart',()=>{if(!live())return;started=true;oldCommit=false;s.composing=true;clearTimeout(imeTimer);});
 el.addEventListener('compositionend',e=>{if(!live())return;if(!started){if(previous&&e.data===previous){oldCommit=true;if(el.value.normalize('NFC')===previous)el.value='';}return;}started=false;s.composing=false;nativeInput();});
 el.addEventListener('input',e=>{if(!live())return;if(oldCommit&&previous&&e.data===previous&&el.value.normalize('NFC')===previous){oldCommit=false;el.value='';return;}oldCommit=false;nativeInput(e);});
 el.addEventListener('paste',e=>{e.preventDefault();toast('請自行輸入，練習鍵位記憶。');});
 el.addEventListener('keydown',e=>{if(!live())return;oldCommit=false;if(e.key==='Enter'&&!e.isComposing){e.preventDefault();if(el.value.normalize('NFC')===target())nativeDone();}});
}
function freshAnswer(){
 let el=document.getElementById('answer');if(!el)return el;
 if(keyMode()&&el.dataset.bound){
  const old=el,previous=old.value.normalize('NFC');el=old.cloneNode(false);el.value='';old.removeAttribute('id');old.parentNode.insertBefore(el,old);bindAnswer(el,previous);
  s.handingOver=true;if(!s.paused)el.focus({preventScroll:true});old.remove();s.handingOver=false;
 }else{el.value='';if(!el.dataset.bound)bindAnswer(el);}
 s.composing=false;return el;
}
function practice(){shell('<section class="panel practice-card" id="practice-card"><div class="card-top"><span class="pill" id="step-name"></span><span class="timer" id="timer"></span></div><div class="target-zone"><p class="question-label" id="question-label"></p><div class="kr" lang="ko" id="target-text"></div><p class="meaning" id="meaning"></p>'+(input==='native'?'<label class="native-label" for="answer">用手機韓文鍵盤輸入</label><input id="answer" class="native-answer kr" lang="ko" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" aria-label="輸入韓文答案"><p class="composition-note">組字時字形會變動；請自行輸入，避免整詞候選、語音代答。</p>':'<div class="typing-preview kr" id="preview" aria-label="已輸入韓文"></div>')+'<div id="hint-area"></div><p id="feedback" class="feedback" role="status"></p></div><div class="practice-actions"><div class="action-left">'+btn('提示','data-action="hint"',true)+btn('暫停','data-action="pause"',true)+'</div><button class="text-btn" data-action="finish">結束並看結果</button></div><div id="pause-area"></div></section>','練習中');paint(true);focus();}
function paint(fresh=false){if(!s)return;document.getElementById('step-name').textContent=modes[s.mode];document.getElementById('question-label').textContent=s.mode==='guide'?'先看看位置，跟著輸入。':keyMode()?'這個字母，在哪個位置？':'照著目標輸入完整詞句。';const t=document.getElementById('target-text');t.textContent=target();t.className='kr '+(keyMode()?'target-glyph':'target-word');document.getElementById('meaning').textContent=s.item?.meaning||'';const k=s.tokens[Math.min(s.cursor,s.tokens.length-1)];document.getElementById('hint-area').innerHTML=s.mode==='guide'||s.hinted?'<p class="mapping"><span class="kr">'+esc(C.KEYMAP[k])+'</span> → <kbd>'+esc(C.label(k))+'</kbd></p><p class="subtitle">'+s.tokens.map(k=>esc(C.KEYMAP[k])).join(' · ')+'</p>':'';const f=document.getElementById('feedback');f.textContent=s.feedback||'';f.classList.toggle('error',!!s.errorFeedback);const p=document.getElementById('preview');if(p)p.textContent=keyMode()?'':C.compose(s.tokens.slice(0,s.cursor));const a=fresh?freshAnswer():document.getElementById('answer');if(a){a.disabled=s.paused;a.setAttribute('aria-busy',String(s.transitioning));}document.getElementById('pause-area').innerHTML=s.paused?'<div class="pause-layer"><h2>休息一下，沒關係。</h2><p>計時已暫停。</p>'+btn('繼續練習','data-action="resume"')+'<button data-action="finish" class="text-btn">結束這一回合</button></div>':'';tick();}
function next(){clearTimeout(imeTimer);s.question=(s.question||0)+1;Object.assign(s,{cursor:0,results:[],errors:0,hinted:false,feedback:'',errorFeedback:false,transitioning:false,nativePrevious:'',stepStart:s.elapsed,composing:false});if(s.mode==='guide')s.tokens=[s.queue[s.guideIndex]];else if(['keys','mixed'].includes(s.mode)){const keys=s.mode==='mixed'?s.mixKeys:D.groups.find(g=>g.id===s.groupId).keys,min=Math.min(...keys.map(k=>s.counts[k]||0)),pool=keys.filter(k=>(s.counts[k]||0)<=min+1);const k=C.chooseKey(pool,stats().keys,s.counts,s.previous);s.tokens=[k];s.previous=k;}else{let pool=s.pool.filter(x=>x.key!==s.item?.key);if(!pool.length)pool=s.pool;const st=stats().items,w=pool.map(x=>{const a=st[x.key];return 1+(a?.attempts?4*(1-a.firstCorrect/a.attempts)+a.hinted/a.attempts:3)+(x.lessonDate===s.latest?1:0);});let n=Math.random()*w.reduce((a,b)=>a+b,0),i=0;while(i<pool.length-1&&(n-=w[i])>0)i++;s.item=pool[i];s.tokens=s.item.tokens;}}
function start(mode,gid,ik){if(s)finish(false);catalog();const g=D.groups.find(g=>g.id===gid)||suggested(),item=pickItem(ik);if(item)mode=item.type;const pool=item?[item]:items.filter(x=>x.type===mode&&(!selectedChapter()||x.chapters.includes(selectedChapter()))).map(x=>({...x,meaning:meaningFor(x)})),ids=(selection||knownGroups().map(g=>g.id)).filter(x=>state.guides.includes(x));if(mode==='mixed'&&!ids.length){route='mixed';render();toast('先完成一組導學，再選已學組別。');return;}if(['words','sentences'].includes(mode)&&!pool.length)return;const queue=[];if(mode==='guide')for(let i=0;i<g.keys.length;i+=2)queue.push(...g.keys.slice(i,i+2),...g.keys.slice(i,i+2));s={id:M.id(),at:new Date().toISOString(),inputMode:input,mode,mistakes:[],groupId:['guide','keys'].includes(mode)?g.id:null,pool,pinned:ik,queue,guideIndex:0,guidePresses:0,elapsed:0,lastTick:performance.now(),minutes:state.settings.minutes,paused:false,events:[],questions:0,counts:{},mixKeys:M.mixedKeys(D.groups,ids),previous:'',latest:pool.map(x=>x.lessonDate).sort().at(-1)||''};next();route='practice';practice();}
function persist(){if(!s||(!s.events.length&&!s.guidePresses&&!s.mistakes.length))return;const r={id:s.id,at:s.at,inputMode:s.inputMode,mode:s.mode,groupId:s.groupId,elapsed:s.elapsed,questions:s.questions,events:s.events.slice(),mistakes:s.mistakes.slice()};state.sessions=state.sessions.filter(x=>x.id!==r.id).concat([r]);save();}
function guideDone(){s.guidePresses++;state.introduced=[...new Set([...state.introduced,s.tokens[0]])];s.guideIndex++;save();if(s.guideIndex===s.queue.length){state.guides=[...new Set([...state.guides,s.groupId])];selection=null;persist();const g=s.groupId;s=null;start('keys',g);toast('導學完成，這組已加入混練。');return;}next();paint(true);focus();}
function addMistakes(rows){if(!s||s.mode==='guide')return;let added=0;for(const row of rows){if(!C.isLetter(row.key))continue;s.mistakes.push({id:M.id(),at:new Date().toISOString(),question:s.question,key:row.key,actual:C.isLetter(row.actual)?row.actual:null});added++;}if(added)persist();}
function record(e){s.events.push(e);if(e.key){s.counts[e.key]=(s.counts[e.key]||0)+1;state.introduced=[...new Set([...state.introduced,e.key])];}}
function done(){s.questions++;s.transitioning=true;persist();if(s.expired){finish();return;}if(keyMode()){next();paint(true);focus();return;}s.feedback='答對了！';paint();const active=s,q=s.question,go=()=>{if(s!==active||s.question!==q)return;if(s.paused){setTimeout(go,200);return;}next();paint(true);focus();};setTimeout(go,1000);}
function nativeInput(event){if(!s||s.paused||s.transitioning)return;tick();clearTimeout(imeTimer);const el=document.getElementById('answer'),changes=K.nativeChanges(s.nativePrevious||'',el.value,target(),{inputType:event?.inputType||'',single:keyMode()});s.nativePrevious=el.value;if(changes.length){s.errors+=changes.length;addMistakes(changes);}const status=M.textStatus(el.value,target(),s.composing);if(status==='complete'&&keyMode()){nativeDone();return;}s.errorFeedback=status==='error';if(status==='error'){s.errors=Math.max(s.errors,1);s.feedback='這裡還沒對上，請退格修改。';}else s.feedback=status==='complete'?'已輸入完整答案。':s.composing?'正在組字…':'';paint();if(status==='complete'){const active=s,q=s.question,t=target();imeTimer=setTimeout(()=>{if(s===active&&s.question===q&&!s.paused&&!s.transitioning&&document.getElementById('answer')===el&&el.value.normalize('NFC')===t)nativeDone();},s.composing?850:400);}}
function nativeDone(){if(!s||s.paused||s.transitioning)return;clearTimeout(imeTimer);tick();if(s.mode==='guide'){guideDone();return;}record({key:keyMode()?s.tokens[0]:null,itemKey:s.item?.key||'',clean:!s.hinted&&!s.errors,hinted:s.hinted,errors:s.errors,ms:s.elapsed-s.stepStart});done();}
function physical(token){if(!s||s.paused||s.transitioning||input!=='physical')return;tick();if(token!==s.tokens[s.cursor]){addMistakes([{key:s.tokens[s.cursor],actual:C.isLetter(token)?token:null}]);s.errors++;s.feedback='這個位置還沒對上，再試一次。';s.errorFeedback=true;paint();return;}if(s.mode==='guide'){guideDone();return;}const prior=s.results[s.cursor],k=s.tokens[s.cursor];s.results[s.cursor]={key:C.isLetter(k)?k:null,itemKey:'',clean:!s.hinted&&!s.errors&&(!prior||prior.clean),hinted:s.hinted||!!prior?.hinted,errors:s.errors+(prior?.errors||0),ms:prior?.ms??s.elapsed-s.stepStart};s.cursor++;s.errors=0;s.hinted=false;s.stepStart=s.elapsed;s.feedback='';s.errorFeedback=false;if(s.cursor===s.tokens.length){for(const e of s.results)if(e.key)record(e);if(s.item)record({key:null,itemKey:s.item.key,clean:s.results.every(e=>e.clean),hinted:s.results.some(e=>e.hinted),errors:s.results.reduce((n,e)=>n+e.errors,0),ms:s.results.reduce((n,e)=>n+(e.ms||0),0)});done();}else paint();}
function tick(){if(!s)return;const now=performance.now();if(!s.paused&&s.mode!=='guide')s.elapsed=Math.min(s.minutes*60000,s.elapsed+Math.max(0,now-s.lastTick));s.lastTick=now;s.expired=s.mode!=='guide'&&s.elapsed>=s.minutes*60000;const el=document.getElementById('timer');if(el)el.textContent=s.mode==='guide'?'跟著輸入・不計時':time(s.elapsed)+' / '+s.minutes+':00'+(s.expired?' · 完成當題後結算':'');}
function pause(){if(!s||s.paused)return;tick();s.paused=true;clearTimeout(imeTimer);paint();document.getElementById('answer')?.blur();window.HangulAndroid?.hideKeyboard?.();}
function resume(){if(!s)return;s.paused=false;s.lastTick=performance.now();paint();focus();if(input==='native'&&document.getElementById('answer').value)nativeInput();}
function finish(show=true){if(!s)return;tick();clearTimeout(imeTimer);if(!s.transitioning&&s.mode!=='guide'&&(s.errors||s.hinted||s.cursor>0||(input==='native'&&document.getElementById('answer')?.value))){if(input==='physical'){for(const e of s.results.slice(0,s.cursor))if(e?.key)record(e);}const k=keyMode()?s.tokens[0]:null;record({key:k,itemKey:s.item?.key||'',clean:false,hinted:s.hinted,errors:s.errors,ms:null});}persist();last={...s,events:s.events.slice()};s=null;window.HangulAndroid?.hideKeyboard?.();if(show){route='result';render();}}
function result(){if(!last){route='home';home();return;}shell('<p class="subtle">'+modes[last.mode]+' · '+last.questions+' 題 · '+time(last.elapsed)+'</p>'+rankingCard(M.mistakeRanking([last],{limit:10}),'本回合錯字','本回合沒有字母錯誤。')+'<div class="result-actions">'+btn('再練一回合','data-action="again"')+btn('查看紀錄','data-route="progress"',true)+btn('回練習桌','data-route="home"',true)+'</div>','練習完成');}
function exportBackup(){if(s)finish();save();const text=M.backup(state),name='韓文完整備份_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';if(window.HangulAndroid){window.HangulAndroid.exportJson(name,text);return;}const url=URL.createObjectURL(new Blob([text],{type:'application/json;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('已準備下載完整備份，請保留JSON檔。');}
function openFile(kind){if(s)pause();expect=kind;if(window.HangulAndroid)window.HangulAndroid.importJson();else file.click();}
function receive(text){try{const p=M.parse(text,D.groups);if((expect==='pack')!==(p.kind==='pack'))throw Error(expect==='pack'?'這是成績備份，請用「匯入完整備份」。':'這是題庫包，請用「匯入題庫」。');let copy=JSON.parse(JSON.stringify(state)),desc;if(p.kind==='pack'){const info=M.addPack(copy,p.value);desc=esc(p.value.title)+'：'+p.value.items.length+'項，'+(info.skipped?'已安裝此版本。':'驗證通過，將加入題庫。');}else{const info=M.merge(copy,p.value,D.groups);copy=info.state;desc='新增 '+info.added+' 個回合，排除 '+info.duplicates+' 個重複回合，題庫一併恢復。'+(p.kind==='legacy'?'舊版作歷史基準保留。':'');}pending=copy;const el=document.createElement('div');el.className='modal-backdrop';el.innerHTML='<section class="modal" role="dialog" aria-modal="true" aria-labelledby="import-title"><h2 id="import-title">匯入前確認</h2><p>'+desc+'</p><div class="actions">'+btn('取消','data-action="cancel-import"',true)+btn('確認匯入','data-action="confirm-import"')+'</div></section>';app.appendChild(el);el.querySelector('button').focus();}catch(e){toast(e.message);}}
function flushUpdates(){if(!queuedPacks||s||pending||blocked)return 0;const result=U.install(state,queuedPacks);queuedPacks=null;state=result.state;const persisted=save();catalog();if(queuedUpdateDay&&persisted)try{localStorage.setItem(AUTO_UPDATE_KEY,queuedUpdateDay);}catch{}queuedUpdateDay='';return result.changed;}
function maybeAutoUpdate(){if(blocked||!window.fetch||!window.crypto?.subtle||s||pending||updateTask||Date.now()-autoAttempt<60000)return;try{if(localStorage.getItem(AUTO_UPDATE_KEY)===U.checkDay())return;}catch{}autoAttempt=Date.now();update(true);}
async function update(quiet=false){
 if(blocked){if(!quiet)toast('請先匯出備份並處理暫存問題。');return false;}if(updateTask)return updateTask;
 if(!quiet)toast('正在取得最新日課題庫…');
 updateTask=(async()=>{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);try{
  const packs=await U.fetchPacks({fetch:window.fetch.bind(window),base:URL_BASE,signal:controller.signal,sha256:async bytes=>Array.from(new Uint8Array(await window.crypto.subtle.digest('SHA-256',bytes))).map(x=>x.toString(16).padStart(2,'0')).join('')});
  queuedPacks=packs;queuedUpdateDay=U.checkDay();const deferred=!!(s||pending),count=flushUpdates();
  if(!deferred&&route==='library')render();if(!quiet)toast(deferred?'題庫已取得，練習或匯入完成後套用。':count?'題庫已更新，原有成績保留。':'已是最新題庫。');return true;
 }catch{if(!quiet)toast('暫時無法更新，原題庫與成績保留；可重試或匯入離線題庫包。');return false;}finally{clearTimeout(timer);}})();
 try{return await updateTask;}finally{updateTask=null;}
}
window.HangulFiles={receiveBase64:x=>receive(new TextDecoder().decode(Uint8Array.from(atob(x),c=>c.charCodeAt(0)))),notice:toast,pause};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.route){if(s)finish(false);route=b.dataset.route;render();return;}if(b.dataset.mode){if(input===b.dataset.mode)return;const focused=document.activeElement===b;if(s)finish(false);input=b.dataset.mode;try{localStorage.setItem('hangul-one-step.input.v2',input);}catch{}render();if(focused)document.getElementById('mode-'+input)?.focus({preventScroll:true});if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.getElementById('mode-switch')?.classList.add('switching');return;}if(b.dataset.start){start(b.dataset.start,b.dataset.group);return;}if(b.dataset.item){start(null,null,b.dataset.item);return;}if(b.dataset.tab){tab=b.dataset.tab;libraryPage=0;render();return;}if(b.dataset.page!==undefined){libraryPage=Number(b.dataset.page)||0;render();return;}if(b.dataset.rankDays){rankDays=b.dataset.rankDays==='all'?null:7;render();return;}const a=b.dataset.action;if(a==='hint'&&s&&!s.paused&&!s.transitioning){s.hinted=true;s.feedback='對照已顯示，下次再自己回想。';paint();focus();}else if(a==='pause')pause();else if(a==='resume')resume();else if(a==='finish')finish();else if(a==='again'&&last)start(last.mode,last.groupId,last.pinned);else if(a==='export')exportBackup();else if(a==='import-pack')openFile('pack');else if(a==='import-backup')openFile('backup');else if(a==='update')update();else if(a==='cancel-import'){pending=null;b.closest('.modal-backdrop').remove();if(flushUpdates()&&route==='library')render();}else if(a==='confirm-import'&&pending){state=pending;pending=null;blocked=false;save();catalog();route=expect==='pack'?'library':'progress';if(expect==='pack'){chapter='';libraryPage=0;}render();toast(expect==='pack'?'題庫已匯入，原有紀錄保留。':'匯入完成，新版回合已合併去重。');}});
document.addEventListener('change',e=>{if(e.target.id==='minutes'){state.settings.minutes=+e.target.value;save();}else if(e.target.id==='chapter'){chapter=e.target.value;libraryPage=0;render();}else if(e.target.dataset.mix){const id=e.target.dataset.mix;selection=e.target.checked?[...new Set([...(selection||[]),id])]:selection.filter(x=>x!==id);document.getElementById('mix-count').textContent='已選 '+M.mixedKeys(D.groups,selection).length+' 個字母';app.querySelector('[data-start="mixed"]').disabled=!selection.length;}});
file.addEventListener('change',async()=>{const f=file.files[0];file.value='';if(!f)return;if(f.size>25*1024*1024){toast('檔案超過25MB，原資料保留。');return;}receive(await f.text());});
document.addEventListener('keydown',e=>{if(pending){if(e.key==='Escape'){pending=null;document.querySelector('.modal-backdrop')?.remove();}return;}if(!s)return;if(e.key==='Escape'){e.preventDefault();s.paused?resume():pause();return;}if(input!=='physical'||s.paused||s.transitioning||e.target.matches('input,textarea,select'))return;if(e.code==='Backspace'){e.preventDefault();if(s.cursor>0){s.cursor--;s.errors=0;s.hinted=false;paint();}return;}const token=C.eventToken(e);if(token!==null){e.preventDefault();physical(token);}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();else maybeAutoUpdate();});window.addEventListener('online',maybeAutoUpdate);window.addEventListener('beforeunload',()=>{if(s){tick();persist();}});setInterval(tick,250);catalog();render();save();maybeAutoUpdate();
})();
