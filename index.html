    if(!session) { route='home';homeView();return; }
    const s=session, guide=s.mode==='guide', keyMode=guide||s.mode==='keys', target=s.tokens[s.cursor], group=D.groups.find(g=>g.id===s.groupId);
    const reveal=guide||s.hintOpen, stepName=guide?'認識新鍵':s.mode==='keys'?'鍵位回想':s.mode==='words'?'詞語練習':'短句練習';
    const hint=reveal?'<div class="mapping"><span class="kr" lang="ko">'+esc(C.KEYMAP[target] === ' '?'空格':C.KEYMAP[target])+'</span><span>→</span><kbd>'+esc(C.label(target))+'</kbd></div>':'';
    const wordPart=keyMode?'':'<p class="meaning">'+esc(s.item.meaning)+'</p><div class="typing-preview kr" lang="ko" aria-label="已輸入韓文">'+esc(C.compose(s.tokens.slice(0,s.cursor)))+(s.transitioning?'':'<span class="caret"></span>')+'</div><span class="composition-note">輸入途中，音節會隨下一個字母重新組合。</span>';
    const card='<section class="panel practice-card" id="practice-card" tabindex="-1" aria-label="韓文打字練習區"><div class="card-top"><span class="pill '+(guide?'peach':'')+'">'+stepName+'</span><span class="timer" data-timer>'+(guide?'跟著按・不計時':timeLabel(s.elapsed)+' / '+s.minutes+':00')+'</span></div><div class="target-zone"><p class="question-label">'+(guide?'先看看對應位置，跟著按一次。':keyMode?'這個字母，在哪個位置？':'照著目標輸入，讓字母慢慢組成詞句。')+'</p><div class="'+(keyMode?'target-glyph':'target-word')+' kr" lang="ko" id="target-text">'+esc(keyMode?C.KEYMAP[target]:s.item.text)+'</div>'+wordPart+hint+'<p class="feedback '+(s.feedbackError?'error':'')+'" role="status">'+esc(s.feedback||'')+'</p>'+(guide?'<div class="step-dots" aria-label="導學進度">'+s.guideQueue.map((_,i)=>'<i class="'+(i<s.guideIndex?'done':'')+'"></i>').join('')+'</div>':'')+'</div><div class="practice-actions"><div class="action-left">'+(!guide?'<button class="button secondary small" data-action="hint">'+icon('hint')+'提示</button>':'<span class="kbd-tip">認識新鍵 '+(s.guideIndex+1)+' / '+s.guideQueue.length+'</span>')+'<button class="button ghost small" data-action="pause">'+icon('pause')+'暫停</button></div><button class="text-btn" data-action="finish">'+(guide?'先練到這裡':'結束並看結果')+'</button></div>'+(s.paused?'<div class="pause-layer"><div class="pause-symbol">'+icon('pause')+'</div><h2>休息一下，沒關係。</h2><p>時間和反應時間都已暫停。<br>回來後，再接著找這個鍵。</p><button class="button" data-action="resume">'+icon('play')+'繼續練習</button><button class="text-btn" data-action="finish" style="margin-top:18px">結束這一回合</button></div>':'')+'</section>';
    const keyboardArea=inputMode==='touch'
      ? Touch.keyboard({target,reveal,shifted:touchShift,disabled:s.paused||s.transitioning,word:keyMode?C.KEYMAP[target]:s.item.text,preview:keyMode?'':C.compose(s.tokens.slice(0,s.cursor)),showPreview:!keyMode,canBackspace:!keyMode&&s.cursor>0,known:guide?[...state.introduced,...group.keys]:state.introduced})
      : ((guide||s.hintOpen)?keyboard(target,true):'<div class="hint-note">'+icon('hint')+'<span>先給記憶一點空間。需要時按「提示」，鍵盤位置就會亮起。</span></div>');
    const groupProgress=group?state.groups[group.id]:null;
    const aside='<aside class="aside"><section class="panel aside-card"><p class="section-label">'+(keyMode?'這一組的字母':'這一'+(s.mode==='words'?'詞':'句')+'的來源')+'</p><h3>'+esc(keyMode?group.name:D.source[s.item.source].label)+'</h3>'+(keyMode?'<div class="glyph-grid">'+group.keys.map(k=>'<div class="glyph-cell"><span class="kr" lang="ko">'+C.KEYMAP[k]+'</span>'+(guide?'<small>'+esc(C.label(k))+'</small>':'')+'</div>').join('')+'</div><p>'+(guide?'先看，再按。導學不計入熟練度。':'先自己回想，卡住時再看提示。')+'</p>':'<p>'+esc(D.source[s.item.source].detail)+'</p><p>空白鍵分開詞語，句號也要輸入。可用退格回到前一個按鍵。</p>')+'</section><section class="panel aside-card"><p class="section-label">這一回合的小進步</p><div class="session-stats"><div><strong>'+percent(s.clean,s.attempts)+'</strong><small>首次無提示</small></div><div><strong>'+s.hinted+'</strong><small>提示完成鍵</small></div><div><strong>'+s.questions+'</strong><small>完成題目</small></div></div><p>'+(guide?'現在只是在認識，不用追求速度。':group&&C.ready(group,groupProgress)?'這組已達建議門檻！結算後可以前往下一組。':'答錯的鍵，我們會在稍後陪你多練幾次。')+'</p></section></aside>';
    shell('<div class="workspace"><div>'+card+keyboardArea+'</div>'+aside+'</div>',guide?'先認識，再慢慢記住。':'讓手指，記住這個位置。',guide?'新鍵先展示對應；完成導學後，才開始回想計時。':(inputMode==='touch'?'點按頁面鍵盤 · 可隨時暫停':'保持英文輸入模式 · Esc 可暫停 · 已練時間不含休息'),'PRACTICE, GENTLY');
  }
  function resultView() {
    if(!lastResult) {homeView();return;}
    const result=lastResult, group=D.groups.find(g=>g.id===result.groupId), pass=group&&C.ready(group,state.groups[group.id]);
    const weak=Object.entries(result.keyStats).sort((a,b)=>(b[1].hinted+b[1].errors)-(a[1].hinted+a[1].errors)).filter(([,v])=>v.hinted||v.errors).slice(0,5);
    const next=pass?D.groups[D.groups.indexOf(group)+1]:null;
    shell('<section class="panel section-box"><div class="result-hero"><div class="result-mark">'+icon('check')+'</div><p class="eyebrow">ANOTHER SMALL STEP</p><h2>'+(result.attempts?'這一小步，已經留下來了。':'新認識的位置，也是一點進步。')+'</h2><p>'+(pass?'這組已達到建議門檻，可以試試下一組。':result.newKeys?'這次多認識了 '+result.newKeys+' 個鍵位。慢慢來，它們會越來越熟悉。':'今天練到這裡也很好。下次，再把它們找回來。')+'</p><div class="result-values"><div><strong>'+percent(result.clean,result.attempts)+'</strong><span>首次無提示答對</span></div><div><strong>'+seconds(result.medianMs)+'</strong><span>中位反應時間</span></div><div><strong>'+timeLabel(result.elapsed)+'</strong><span>有效練習時間</span></div></div><p>完成 '+result.questions+' 題 · '+result.attempts+' 個字母鍵 · '+result.hinted+' 鍵看過提示<br>導學跟打不計入答對率；提示後完成與獨立回想分開記錄。</p>'+(weak.length?'<p>下一次，多陪這幾個鍵一下。</p><div class="weak-list">'+weak.map(([key])=>'<span><b class="kr">'+C.KEYMAP[key]+'</b>'+esc(C.label(key))+'</span>').join('')+'</div>':'')+'<div class="result-actions">'+(next?'<button class="button" data-start="guide" data-group="'+next.id+'">認識下一組'+icon('arrow')+'</button>':'')+'<button class="button '+(next?'secondary':'')+'" data-action="again">'+(result.mode==='guide'?'繼續認識這一組':'再練一小回合')+'</button><button class="button secondary" data-route="library">看看可練的詞句</button><button class="button ghost" data-action="export">匯出備份</button></div></div></section><div class="source-note panel">本次進度已記在這個工具裡。'+(storageStatus==='ok'?'瀏覽器暫存可能因清除資料或移動頁面而消失；適時匯出一份備份，便能在需要時恢復。':'目前暫存不可用，請現在匯出備份，保留這次進步。')+'</div>','每一次練習，都算數。','一點點準確，一點點熟悉。先把自己的步調找回來。','YOUR ROUND, SAVED');
  }
  function render() {
    if(route==='groups') groupsView(); else if(route==='library') libraryView(); else if(route==='progress') progressView();
    else if(route==='practice') practiceView(); else if(route==='result') resultView(); else homeView();
  }
  function tick() {
    if(!session) return;
    const now=performance.now();
    if(!session.paused&&session.mode!=='guide') session.elapsed=Math.min(session.minutes*60000,session.elapsed+Math.max(0,now-session.lastTick));
    session.lastTick=now;
    session.expired=session.mode!=='guide' && session.elapsed>=session.minutes*60000;
    if(session.expired && !session.expireNotified) {
      session.expireNotified=true;
      toast('這一回合的時間到了。完成當題即可結算，也可以直接結束。');
    }
    document.querySelectorAll('[data-timer]').forEach(el=>{el.textContent=session.mode==='guide'?'跟著按・不計時':timeLabel(Math.min(session.elapsed,session.minutes*60000))+' / '+session.minutes+':00'+(session.expired?' · 完成當題後結算':'');});
  }
  function newStep() { session.flags={errors:0,hinted:false}; session.stepStart=session.elapsed; session.hintOpen=false; }
  function nextQuestion() {
    const s=session; s.cursor=0;s.stepResults=[];s.feedback='';s.feedbackError=false;
    if(s.mode==='guide') s.tokens=[s.guideQueue[s.guideIndex]];
    else if(s.mode==='keys') { const group=D.groups.find(g=>g.id===s.groupId); const token=C.chooseKey(group.keys,state.stats,state.groups[group.id]?.counts,s.previousKey);s.tokens=[token];s.previousKey=token; }
    else {
      const candidates=s.pool.filter(item=>item.id!==s.item?.id), pool=candidates.length?candidates:s.pool;
      const weights=pool.map(item=>1+item.tokens.filter(C.isLetter).reduce((n,k)=>{const stat=state.stats[k];return n+(stat?.attempts?1-stat.firstCorrect/stat.attempts:1);},0)/item.tokens.length*3);
      let value=Math.random()*weights.reduce((a,b)=>a+b,0), index=0;
      for(;index<pool.length-1;index++){value-=weights[index];if(value<0)break;}
      s.item=pool[index];s.tokens=s.item.tokens;
    }
    newStep();
  }
  function start(mode,groupId,itemId) {
    if(session) finish(false);
    const group=D.groups.find(g=>g.id===groupId)||recommended();
    const item=itemId?allItems.find(i=>i.id===itemId):null;
    if(item) mode=item.type;
    const pool=item?[item]:allItems.filter(i=>i.type===mode&&available(i));
    if(['words','sentences'].includes(mode)&&!pool.length){route='groups';render();toast('先認識幾個所需鍵位，再來練詞句。也可在詞句頁自由挑戰。');return;}
    touchShift=false;
    const queue=[];
    if(mode==='guide') for(let i=0;i<group.keys.length;i+=2){const pair=group.keys.slice(i,i+2);queue.push(...pair,...pair);}
    session={mode,initialMode:mode,groupId:['keys','guide'].includes(mode)?group.id:null,pool,item:null,pinnedId:item?.id||null,guideQueue:queue,guideIndex:0,guidePresses:0,minutes:state.settings.minutes,elapsed:0,lastTick:performance.now(),paused:false,expired:false,expireNotified:false,attempts:0,clean:0,hinted:0,errors:0,questions:0,latencies:[],keyStats:{},startKnown:knownCount(),previousKey:''};
    nextQuestion();route='practice';render();
  }
  function commitQuestion(partial=false) {
    const s=session;
    if(s.mode==='guide') return;
    if(partial&&(s.flags.errors||s.flags.hinted)&&!s.stepResults[s.cursor]) s.stepResults[s.cursor]={clean:false,hinted:s.flags.hinted,errors:s.flags.errors,ms:null};
    s.stepResults.forEach((outcome,i)=>{
      if(!outcome) return;
      const key=s.tokens[i];
      s.errors+=outcome.errors;
      if(!C.isLetter(key)) return;
      s.attempts++;s.clean+=outcome.clean?1:0;s.hinted+=outcome.hinted?1:0;
      if(outcome.clean&&outcome.ms!==null)s.latencies.push(outcome.ms);
      s.keyStats[key]=C.record(s.keyStats[key]||C.blankStat(),outcome);
      state.stats[key]=C.record(state.stats[key]||C.blankStat(),outcome);
      if(s.mode==='keys'){
        const progress=state.groups[s.groupId]||(state.groups[s.groupId]={counts:{},recent:[]});
        progress.counts[key]=(progress.counts[key]||0)+1;progress.recent=[...progress.recent,outcome.clean].slice(-20);
      }
    });
    s.stepResults=[];s.flags={errors:0,hinted:false};save();
  }
  function finish(show=true) {
    if(!session)return;
    tick();const s=session;
    commitQuestion(true);
    const actualMode=s.attempts===0&&s.guidePresses>0?'guide':s.mode;
    const summary={at:new Date().toISOString(),mode:actualMode,groupId:s.groupId,attempts:s.attempts,clean:s.clean,hinted:s.hinted,errors:s.errors,questions:s.questions,elapsed:s.elapsed,medianMs:C.median(s.latencies)};
    if(s.attempts||s.guidePresses)state.sessions=[...state.sessions,summary].slice(-500);
    lastResult={...summary,newKeys:knownCount()-s.startKnown,keyStats:s.keyStats,pinnedId:s.pinnedId,initialMode:s.initialMode};
    session=null;save();if(show){route='result';render();}
  }
  function pause() { if(session&&!session.paused){tick();session.paused=true;render();} }
  function resume() { if(session){session.lastTick=performance.now();session.paused=false;render();} }
  function useHint() {
    if(!session||session.paused||session.transitioning||session.mode==='guide')return;
    tick();session.flags.hinted=true;session.hintOpen=true;session.feedback='位置亮起來了。跟著找一次，下次再自己試。';session.feedbackError=false;render();
  }
  function accept(token) {
    const s=session;tick();
    const expected=s.tokens[s.cursor];
    if(token!==expected){s.flags.errors++;s.feedback='這個位置還沒對上，慢慢試。需要時可以看提示。';s.feedbackError=true;render();return;}
    if(C.isLetter(expected)&&!introduced(expected))state.introduced.push(expected);
    if(s.mode==='guide'){
      s.guidePresses++;s.guideIndex++;save();
      if(s.guideIndex>=s.guideQueue.length){s.mode='keys';s.elapsed=0;s.lastTick=performance.now();toast('新鍵已認識。現在收起對照，試著自己回想；回合開始計時。');}
      nextQuestion();render();return;
    }
    const prior=s.stepResults[s.cursor], clean=!s.flags.hinted&&!s.flags.errors;
    s.stepResults[s.cursor]={clean:clean&&(!prior||prior.clean),hinted:s.flags.hinted||!!prior?.hinted,errors:s.flags.errors+(prior?.errors||0),ms:prior?.ms??Math.max(0,s.elapsed-s.stepStart)};
    s.cursor++;
    if(s.cursor===s.tokens.length){
      commitQuestion();s.questions++;
      if(s.expired){finish();return;}
      const wasWord=s.mode!=='keys';
      if(wasWord){
        s.transitioning=true;s.feedback='完成了！讓這個詞句多留一會兒。';s.feedbackError=false;render();
        const moveOn=()=>{
          if(session!==s)return;
          if(s.paused){setTimeout(moveOn,150);return;}
          tick();if(s.expired){finish();return;}
          s.transitioning=false;nextQuestion();render();
        };
        setTimeout(moveOn,1100);return;
      }
      nextQuestion();s.feedback='答對了，繼續找下一個。';
    }else{newStep();s.feedback='';s.feedbackError=false;}
    render();
  }
  function submitStroke(token) {
    if(!session||session.paused||session.transitioning||pendingImport||route!=='practice'||token===null||C.KEYMAP[token]===undefined)return;
    if((token===' '||token==='.')&&!['words','sentences'].includes(session.mode))return;
    touchShift=false;accept(token);
  }
  function backspace() {
    if(!session||session.paused||session.transitioning||pendingImport||!['words','sentences'].includes(session.mode))return;
    tick();touchShift=false;
    if(session.cursor>0){
      if(session.flags.errors||session.flags.hinted){
        const previous=session.stepResults[session.cursor]||{clean:false,hinted:false,errors:0,ms:null};
        previous.clean=false;previous.hinted=previous.hinted||session.flags.hinted;previous.errors+=session.flags.errors;session.stepResults[session.cursor]=previous;
      }
      session.cursor--;newStep();session.feedback='已退回上一個按鍵。';render();
    }
  }
  function exportBackup() {
    if(session)pause();
    save();const blob=new Blob([C.backup(state)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='韓文鍵位備份_'+new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Hong_Kong'})+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已準備下載備份，請保留這個JSON檔案。');
  }
  function renderImportModal() {
    const node=document.createElement('div');node.className='modal-backdrop';node.innerHTML='<section class="modal" role="dialog" aria-modal="true" aria-labelledby="import-title"><h2 id="import-title">使用這份備份？</h2><p>備份包含 '+pendingImport.introduced.length+' 個已認識鍵位、'+pendingImport.sessions.length+' 個回合。<br>確認後會取代目前工具進度。你可以先取消並匯出目前的備份。</p><div class="actions"><button class="button secondary small" data-action="cancel-import">取消</button><button class="button small" data-action="confirm-import">使用這份備份</button></div></section>';
    app.appendChild(node);node.querySelector('[data-action="cancel-import"]').focus();
  }
  document.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button||button.disabled)return;
    if(button.dataset.inputMode){
      inputMode=button.dataset.inputMode==='touch'?'touch':'physical';touchShift=false;
      try {localStorage.setItem(INPUT_STORE,inputMode);} catch {}
      render();return;
    }
    if(button.dataset.key!==undefined){submitStroke(Touch.token(button.dataset.key,touchShift));return;}
    if(button.dataset.route){if(session)finish(false);route=button.dataset.route;render();return;}
    if(button.dataset.start){start(button.dataset.start,button.dataset.group);return;}
    if(button.dataset.item){start(null,null,button.dataset.item);return;}
    if(button.dataset.tab){libraryTab=button.dataset.tab;render();return;}
    const action=button.dataset.action;
    if(action==='touch-shift'){if(session&&!session.paused&&!session.transitioning){touchShift=!touchShift;render();}}
    else if(action==='backspace')backspace();else if(action==='hint')useHint();else if(action==='pause')pause();else if(action==='resume')resume();else if(action==='finish')finish();
    else if(action==='export')exportBackup();
    else if(action==='import'){if(session)pause();fileInput.click();}
    else if(action==='cancel-import'){pendingImport=null;render();}
    else if(action==='confirm-import'){
      if(session)finish(false);state=pendingImport;pendingImport=null;blockWrite=false;save();route='home';render();toast('備份已恢復，可以從原來的進度繼續。');
    }else if(action==='again'&&lastResult){start(lastResult.mode==='guide'?'guide':lastResult.mode,lastResult.groupId,lastResult.pinnedId);}
  });
  document.addEventListener('change',event=>{
    if(event.target.dataset.setting==='minutes'){state.settings.minutes=Number(event.target.value)===5?5:3;save();}
  });
  fileInput.addEventListener('change',async()=>{
    const file=fileInput.files[0];fileInput.value='';if(!file)return;
    if(file.size>2*1024*1024){toast('備份檔案太大，請選擇本工具匯出的JSON。原有進度已保留。');return;}
    try {pendingImport=C.parseBackup(await file.text(),D.groups);render();}catch(error){toast(error.message);}
  });
  document.addEventListener('keydown',event=>{
    if(pendingImport){if(event.key==='Escape'){pendingImport=null;render();}if(event.key==='Tab'){const buttons=[...document.querySelectorAll('.modal button')];if(event.shiftKey&&document.activeElement===buttons[0]){event.preventDefault();buttons.at(-1).focus();}else if(!event.shiftKey&&document.activeElement===buttons.at(-1)){event.preventDefault();buttons[0].focus();}}return;}
    if(!session||route!=='practice')return;
    if(event.key==='Escape'){event.preventDefault();session.paused?resume():pause();return;}
    if(session.paused||session.transitioning||event.target.matches('input,select,textarea')||event.ctrlKey||event.altKey||event.metaKey)return;
    if(event.isComposing||event.key==='Process'||event.keyCode===229){toast('請先切換到英文輸入模式，再按實體鍵。');return;}
    if(event.repeat)return;
    if(event.code==='Backspace'){event.preventDefault();backspace();return;}
    const token=C.eventToken(event);if(token===null)return;
    if((token===' '||token==='.')&&!['words','sentences'].includes(session.mode))return;
    event.preventDefault();submitStroke(token);
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
  window.addEventListener('blur',()=>pause());
  window.addEventListener('beforeunload',()=>{if(session)finish(false);});
  setInterval(tick,250);
  render();
})();

</script>
</body>
</html>
